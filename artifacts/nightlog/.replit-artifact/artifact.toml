kind = "web"
previewPath = "/"
title = "Nightlog"
version = "1.0.0"
id = "artifacts/nightlog"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25953

[services.development]
run = "pnpm --filter @workspace/nightlog run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nightlog", "run", "build" ]
publicDir = "artifacts/nightlog/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25953"
BASE_PATH = "/"
